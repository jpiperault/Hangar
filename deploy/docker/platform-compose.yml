# Services partagés de la plateforme
name: platform
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: postgres.env
    volumes:
      - /srv/platform/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks: [platform]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  platform:
    external: true

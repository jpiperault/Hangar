# Installé par Hangar. nftables.service fait « flush ruleset » au démarrage (via /etc/nftables.conf) et à l'arrêt :
# cela effacerait les règles réseau de Docker. Le pare-feu de la plateforme est géré par platform-firewall.service.
[Service]
ExecStart=
ExecStart=/bin/true
ExecReload=
ExecReload=/bin/true
ExecStop=
ExecStop=/bin/true

{% extends "base.html" %}
{% block main %}
<div class="bar">
  <h1>Journal</h1>
  <form method="get" action="/journal" style="display:flex;gap:8px;align-items:center">
    <label for="app" class="hint">Filtrer</label>
    <select id="app" name="app" onchange="this.form.submit()">
      <option value="">Tout</option>
      {% for n in names %}<option value="{{ n }}" {{ 'selected' if n == app_filter }}>{{ n }}</option>{% endfor %}
    </select>
    <noscript><button class="btn sm">Filtrer</button></noscript>
  </form>
</div>
<div class="tablebox">
  <table>
    <thead><tr><th>Date</th><th>Source</th><th>Événement</th></tr></thead>
    <tbody>
    {% for e in events %}
      <tr><td class="mono" style="white-space:nowrap">{{ e.ts | clock }}</td><td class="mono">{{ e.app }}</td><td class="lv-{{ e.level }}">{{ e.msg }}</td></tr>
    {% else %}
      <tr><td colspan="3" class="empty">Aucun événement pour l'instant.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

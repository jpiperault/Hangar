{% extends "base.html" %}
{% block main %}
<link rel="stylesheet" href="/static/vendor/xterm.css">
<div class="bar"><div><div class="crumb"><a href="/">Applications</a> / <a href="/apps/{{ a.slug }}">{{ a.name }}</a> /</div><h1>Terminal</h1>
  <span class="hint">Terminal interactif dans le conteneur (bash ou sh) : vim, top, complétion. Coupé après 30 min sans activité, 4 h au plus. Ouverture et fermeture notées au journal de l'appli.</span></div></div>
<section class="panel" style="display:flex;flex-direction:column;gap:10px">
  <div class="inlinefield" style="flex-wrap:wrap"><label for="which">Conteneur</label>
    <select id="which">{% for k, c, label in containers %}<option value="{{ k }}">{{ label }} ({{ c }})</option>{% endfor %}</select>
    <label class="check"><input type="checkbox" id="asroot"><span>en root</span></label>
    <button class="btn sm" type="button" id="xconnect">Reconnecter</button>
    <span class="hint" id="xstatus" aria-live="polite"></span></div>
  <div id="xterm" data-slug="{{ a.slug }}" data-connecting="connexion…" data-connected="connecté" data-closed="session terminée : « Reconnecter » pour en ouvrir une autre" data-refused="refusé (compte administrateur, réseau local)" style="height:65vh;min-height:320px;background:#111418;border-radius:8px;padding:6px"></div>
</section>
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/terminal.js"></script>
{% endblock %}

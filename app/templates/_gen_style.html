<style>
/* Générateur de prompt : formulaire à gauche, prompt collant à droite */
.gen-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
.gen-grid form{display:flex;flex-direction:column;gap:14px;min-width:0}
.gen-grid fieldset{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 18px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.gen-grid legend{padding:0 6px;font-weight:700;font-size:.95rem}
.gen-grid label{font-weight:600}
.gen-grid .check span{font-weight:500}
.gen-grid input.bad{border-color:var(--warn)}
.out{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.outbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gen-label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.btns{display:flex;gap:8px}
.btn.ghost{background:var(--surface)}
.btn#copy{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
pre#prompt{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-family:var(--mono);font-size:.78rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:calc(100vh - 120px);overflow:auto}
.warns{display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warn-soft);border-left:3px solid var(--warn);padding:6px 10px;border-radius:0 6px 6px 0;font-size:.82rem}
.toast{font-size:.85rem;color:var(--ok);font-weight:600;min-height:1.2em}
.gen-intro{color:var(--muted);max-width:75ch}
@media (max-width:1000px){.gen-grid{grid-template-columns:1fr}.out{position:static}pre#prompt{max-height:none}}
</style>
